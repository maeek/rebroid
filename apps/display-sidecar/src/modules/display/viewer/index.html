<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rebroid Display</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #f8fafc;
      font: 14px system-ui, sans-serif;
      -webkit-touch-callout: none;
      user-select: none;
    }

    main {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      background: #000;
    }

    canvas,
    video {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
      cursor: crosshair;
      touch-action: none;
    }

    section {
      box-sizing: border-box;
      width: min(260px, calc(100% - 32px));
      text-align: center;
    }

    .device {
      position: relative;
      width: 116px;
      height: 156px;
      margin: 0 auto 22px;
      border: 2px solid rgb(148 163 184 / 38%);
      border-radius: 28px;
      background: linear-gradient(160deg, #111827, #020617 72%);
      box-shadow: 0 24px 70px rgb(0 0 0 / 36%);
    }

    .device::before {
      position: absolute;
      top: 9px;
      left: 42px;
      width: 32px;
      height: 4px;
      border-radius: 999px;
      background: rgb(148 163 184 / 48%);
      content: "";
    }

    .device::after {
      position: absolute;
      right: 22px;
      bottom: 16px;
      left: 22px;
      height: 6px;
      border-radius: 999px;
      background: rgb(34 197 94 / 72%);
      box-shadow: 0 0 18px rgb(34 197 94 / 48%);
      content: "";
    }

    .screen-art {
      position: absolute;
      inset: 34px 18px 36px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgb(148 163 184 / 28%);
      border-radius: 16px;
      background: rgb(15 23 42 / 82%);
    }

    .display-mark {
      width: 58px;
      height: 58px;
      color: rgb(34 197 94 / 86%);
      filter: drop-shadow(0 0 14px rgb(34 197 94 / 34%));
    }

    .display-mark rect,
    .display-mark path {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 4;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: 0;
    }

    p {
      margin: 8px 0 0;
      color: #cbd5e1;
      line-height: 1.45;
    }

    .compatibility {
      display: flex;
      max-width: 100%;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-top: 1px solid rgb(245 158 11 / 42%);
      border-radius: 6px;
      background: rgb(120 53 15 / 34%);
      color: #fcd34d;
      font-size: 12px;
      line-height: 1.3;
    }

    .hidden {
      display: none;
    }
  </style>
  <link rel="stylesheet" href="/viewer/display/assets/styles.css" />
</head>
<body>
  <main>
    <video id="screen-video" class="hidden" autoplay playsinline muted></video>
    <canvas id="screen-snapshot" class="hidden"></canvas>
    <canvas id="screen" class="hidden"></canvas>
    <section id="message">
      <div class="device" aria-hidden="true">
        <div class="screen-art">
          <svg class="display-mark" viewBox="0 0 64 64" focusable="false" aria-hidden="true">
            <rect x="13" y="12" width="38" height="34" rx="5" />
            <path d="M24 53h16" />
            <path d="M32 46v7" />
            <path d="M22 23h20" />
            <path d="M22 32h12" />
          </svg>
        </div>
      </div>
      <h1 id="message-title">Starting live display</h1>
      <p id="message-copy">Rebroid is opening the app screen.</p>
      <p id="status">Connecting...</p>
      <p id="compatibility" class="compatibility hidden"></p>
    </section>
  </main>
  <script type="module" src="/viewer/display/assets/app.js"></script>
</body>
</html>
