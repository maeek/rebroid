<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rebroid Display</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #f8fafc;
      font: 14px system-ui, sans-serif;
      -webkit-touch-callout: none;
      user-select: none;
    }

    main {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      background: #000;
    }

    canvas,
    video {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
      cursor: crosshair;
      touch-action: none;
    }

    section {
      box-sizing: border-box;
      width: min(260px, calc(100% - 32px));
      text-align: center;
    }

    .device {
      display: block;
      width: min(176px, 100%);
      height: auto;
      max-height: 25vh;
      object-fit: contain;
      margin: 0 auto 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: 0;
    }

    p {
      margin: 8px 0 0;
      color: #cbd5e1;
      line-height: 1.45;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <video id="screen-video" class="hidden" autoplay playsinline muted disablepictureinpicture></video>
    <canvas id="screen-snapshot" class="hidden"></canvas>
    <canvas id="screen" class="hidden"></canvas>
    <section id="message">
      <img class="device" src="/viewer/display/assets/device.webp" width="336" height="192" alt="" />
      <h1 id="message-title">Starting live display</h1>
      <p id="message-copy">Rebroid is opening the app screen.</p>
      <p id="status">Connecting...</p>
    </section>
  </main>
  <script type="module" src="/viewer/display/assets/app.js"></script>
</body>
</html>
