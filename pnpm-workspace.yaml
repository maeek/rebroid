packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": ^24.19.2
  prettier: 3.9.10
  typescript: ^5.9.3

allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@scarf/scarf": false
  bcrypt: true
  better-sqlite3: true
  cpu-features: false
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true

injectWorkspacePackages: true

onlyBuiltDependencies:
  - "@nestjs/core"
  - bcrypt
  - better-sqlite3
