packages:
  - apps/*
  - packages/*

allowBuilds:
  '@nestjs/core': set this to true or false
  '@parcel/watcher': set this to true or false
  '@scarf/scarf': set this to true or false
  bcrypt: set this to true or false
  better-sqlite3: set this to true or false
  cpu-features: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false
  ssh2: set this to true or false
  unrs-resolver: set this to true or false

injectWorkspacePackages: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - bcrypt
  - better-sqlite3
