services:
  orchestrator:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    image: localhost/rebroid/orchestrator:local
    # The rootful engine socket may be writable only by root or a host-specific GID.
    user: "0:0"
    restart: unless-stopped
    environment:
      DISPLAY_SIDECAR_AUTO_START: "false"
      WEB_INTERNAL_URL: http://web:3101
      OCR_SIDECAR_BASE_URL: http://ocr-sidecar:8100
      EXTERNAL_ADB_BROKER_URL: http://external-adb:8000
      EXTERNAL_ADB_BROKER_SECRET:
      EXTERNAL_ADB_TCP_ENDPOINTS: ${EXTERNAL_ADB_TCP_ENDPOINTS:-}
    volumes:
      - ${CONTAINER_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - orchestrator-data:/app/data
      - orchestrator-uploads:/app/uploads
      - shared-secrets:/app/secrets
      - firewall-agent-run:/run/rebroid-firewall
    networks: [platform, external-adb]

  firewall-agent:
    build:
      context: ..
      dockerfile: apps/firewall-agent/Dockerfile
    image: localhost/rebroid/firewall-agent:local
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - firewall-agent-run:/run/rebroid-firewall
      - shared-secrets:/app/secrets:ro

  web:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: localhost/rebroid/web:local
    restart: unless-stopped
    depends_on: [orchestrator]
    environment:
      REBROID_TLS_HOSTS:
      EXTERNAL_ADB_BROKER_SECRET:
    volumes:
      - web-data:/app/data
      - shared-secrets:/app/secrets:ro
    networks: [platform, external-adb]

  edge:
    build:
      context: ./edge
    image: localhost/rebroid/edge:local
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
        restart: true
      display-sidecar:
        condition: service_started
      external-adb:
        condition: service_started
        restart: true
    environment:
      REBROID_PUBLIC_HOSTS:
    ports:
      - "${REBROID_HTTPS_PORT:-3443}:3443"
    volumes:
      - web-data:/app/data:ro
    networks: [platform, external-adb]

  display-sidecar:
    platform: linux/amd64
    build: &display-sidecar-build
      context: ..
      dockerfile: apps/display-sidecar/Dockerfile
    image: localhost/rebroid/display-sidecar:local
    container_name: rebroid-display-sidecar
    restart: unless-stopped
    environment:
      DISPLAY_WEBRTC_UDP_PORT: ${DISPLAY_WEBRTC_UDP_PORT:-40000}
      DISPLAY_WEBRTC_ICE_HOST:
    ports:
      - "${DISPLAY_WEBRTC_UDP_PORT:-40000}:${DISPLAY_WEBRTC_UDP_PORT:-40000}/udp"
    volumes:
      - shared-secrets:/app/secrets:ro
    networks: [platform]

  ocr-sidecar:
    platform: linux/amd64
    build:
      context: ../apps/ocr-sidecar
    image: localhost/rebroid/ocr-sidecar:local
    restart: unless-stopped
    networks: [platform]

  external-adb:
    platform: linux/amd64
    build: *display-sidecar-build
    image: localhost/rebroid/display-sidecar:local
    restart: unless-stopped
    init: true
    user: "1000:1000"
    environment:
      EXTERNAL_ADB_ENABLED: "true"
      EXTERNAL_ADB_TCP_ENDPOINTS: ${EXTERNAL_ADB_TCP_ENDPOINTS:-}
      EXTERNAL_ADB_USB_PORTS: ${EXTERNAL_ADB_USB_PORTS:-}
      EXTERNAL_ADB_KEYS_DIRECTORY: /app/adb-keys
      DISPLAY_SIDECAR_SHARED_SECRET: ${EXTERNAL_ADB_BROKER_SECRET:-}
      DISPLAY_WEBRTC_UDP_PORT: ${EXTERNAL_DISPLAY_WEBRTC_UDP_PORT:-40002}
      DISPLAY_WEBRTC_ICE_HOST: ${DISPLAY_WEBRTC_ICE_HOST:-}
      ADB_BINARY_OUTPUT_MAX_BYTES: "12582912"
    ports:
      - "${EXTERNAL_DISPLAY_WEBRTC_UDP_PORT:-40002}:${EXTERNAL_DISPLAY_WEBRTC_UDP_PORT:-40002}/udp"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    group_add:
      - "${EXTERNAL_ADB_USB_GID:-1000}"
    device_cgroup_rules:
      - "c 189:* rw"
    volumes:
      - external-adb-keys:/app/adb-keys
      # Mount an empty volume unless the operator explicitly opts in to host USB.
      - ${EXTERNAL_ADB_USB_SOURCE:-external-adb-no-usb}:/dev/bus/usb:ro
    networks: [external-adb]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/health/ready',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  orchestrator-data:
  firewall-agent-run:
  orchestrator-uploads:
  shared-secrets:
  web-data:
  external-adb-keys:
  external-adb-no-usb:

networks:
  platform:
    name: rebroid-platform
  external-adb:
