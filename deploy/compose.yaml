services:
  orchestrator:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    image: localhost/rebroid/orchestrator:local
    # The rootful engine socket may be writable only by root or a host-specific GID.
    user: "0:0"
    restart: unless-stopped
    environment:
      DISPLAY_SIDECAR_AUTO_START: "false"
      WEB_INTERNAL_URL: http://web:3101
      OCR_SIDECAR_BASE_URL: http://ocr-sidecar:8100
    volumes:
      - ${CONTAINER_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - orchestrator-data:/app/data
      - orchestrator-uploads:/app/uploads
      - shared-secrets:/app/secrets
      - firewall-agent-run:/run/rebroid-firewall
    networks: [platform, external-adb]

  firewall-agent:
    build:
      context: ..
      dockerfile: apps/firewall-agent/Dockerfile
    image: localhost/rebroid/firewall-agent:local
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - firewall-agent-run:/run/rebroid-firewall
      - shared-secrets:/app/secrets:ro

  web:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: localhost/rebroid/web:local
    restart: unless-stopped
    depends_on: [orchestrator]
    environment:
      REBROID_TLS_HOSTS:
    volumes:
      - web-data:/app/data
      - shared-secrets:/app/secrets:ro
    networks: [platform, external-adb]

  edge:
    build:
      context: ./edge
    image: localhost/rebroid/edge:local
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
        restart: true
      display-sidecar:
        condition: service_started
      external-adb:
        condition: service_started
        restart: true
    environment:
      REBROID_PUBLIC_HOSTS:
    ports:
      - "${REBROID_HTTPS_PORT:-3443}:3443"
    volumes:
      - web-data:/app/data:ro
    networks: [platform, external-adb]

  display-sidecar:
    platform: linux/amd64
    build: &display-sidecar-build
      context: ..
      dockerfile: apps/display-sidecar/Dockerfile
    image: localhost/rebroid/display-sidecar:local
    container_name: rebroid-display-sidecar
    restart: unless-stopped
    environment:
      DISPLAY_WEBRTC_UDP_PORT: ${DISPLAY_WEBRTC_UDP_PORT:-40000}
      DISPLAY_WEBRTC_ICE_HOST:
    ports:
      - "${DISPLAY_WEBRTC_UDP_PORT:-40000}:${DISPLAY_WEBRTC_UDP_PORT:-40000}/udp"
    volumes:
      - shared-secrets:/app/secrets:ro
    networks: [platform]

  ocr-sidecar:
    platform: linux/amd64
    build:
      context: ../apps/ocr-sidecar
    image: localhost/rebroid/ocr-sidecar:local
    restart: unless-stopped
    networks: [platform]

  external-adb:
    platform: linux/amd64
    build: *display-sidecar-build
    image: localhost/rebroid/display-sidecar:local
    restart: unless-stopped
    init: true
    user: "1000:1000"
    depends_on:
      orchestrator:
        condition: service_healthy
    environment:
      EXTERNAL_ADB_ENABLED: "true"
      DISPLAY_WEBRTC_UDP_PORT: ${EXTERNAL_DISPLAY_WEBRTC_UDP_PORT:-40002}
      DISPLAY_WEBRTC_ICE_HOST: ${DISPLAY_WEBRTC_ICE_HOST:-}
    ports:
      - "${EXTERNAL_DISPLAY_WEBRTC_UDP_PORT:-40002}:${EXTERNAL_DISPLAY_WEBRTC_UDP_PORT:-40002}/udp"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - external-adb-keys:/app/adb-keys
      - type: volume
        source: shared-secrets
        target: /run/rebroid-external-adb
        read_only: true
        volume:
          subpath: external-adb
          nocopy: true
    networks: [external-adb]

volumes:
  orchestrator-data:
  firewall-agent-run:
  orchestrator-uploads:
  shared-secrets:
  web-data:
  external-adb-keys:

networks:
  platform:
    name: rebroid-platform
  external-adb:
