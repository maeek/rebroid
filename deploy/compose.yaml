services:
  orchestrator:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    image: localhost/rebroid/orchestrator:local
    container_name: rebroid-orchestrator
    user: "0:0"
    restart: unless-stopped
    environment:
      DISPLAY_SIDECAR_AUTO_START: "false"
      FIREWALL_AGENT_SOCKET: /run/rebroid-firewall/agent.sock
      OCR_SIDECAR_BASE_URL: http://rebroid-ocr-sidecar:8100
    expose:
      - "4100"
      - "8000"
    volumes:
      # Redroid requires a rootful Docker-compatible engine socket.
      - ${CONTAINER_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - orchestrator-data:/app/data
      - orchestrator-uploads:/app/uploads
      - shared-secrets:/app/secrets
      - firewall-agent-run:/run/rebroid-firewall
    networks:
      - platform

  firewall-agent:
    build:
      context: ..
      dockerfile: apps/firewall-agent/Dockerfile
    image: localhost/rebroid/firewall-agent:local
    container_name: rebroid-firewall-agent
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - firewall-agent-run:/run/rebroid-firewall
      - shared-secrets:/app/secrets:ro

  web:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: localhost/rebroid/web:local
    container_name: rebroid-web
    restart: unless-stopped
    depends_on:
      - orchestrator
      - display-sidecar
    environment:
      REBROID_TLS_HOSTS: ${REBROID_TLS_HOSTS:-localhost,127.0.0.1}
    ports:
      - "${REBROID_HTTPS_PORT:-3443}:3443"
    volumes:
      - web-data:/app/data
      - shared-secrets:/app/secrets
    networks:
      - platform

  display-sidecar:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/display-sidecar/Dockerfile
    image: localhost/rebroid/display-sidecar:local
    container_name: rebroid-display-sidecar
    restart: unless-stopped
    environment:
      DISPLAY_SIDECAR_SHARED_SECRET_FILE: /app/secrets/rebroid-shared-secret
      DISPLAY_WEBRTC_UDP_PORT_RANGE: ${DISPLAY_WEBRTC_UDP_PORT_RANGE:-40000-40100}
      DISPLAY_WEBRTC_ICE_HOST: ${DISPLAY_WEBRTC_ICE_HOST:-}
    expose:
      - "8000"
    ports:
      - "${DISPLAY_WEBRTC_UDP_PORT_RANGE:-40000-40100}:${DISPLAY_WEBRTC_UDP_PORT_RANGE:-40000-40100}/udp"
    volumes:
      - shared-secrets:/app/secrets
    networks:
      platform:
        aliases:
          - rebroid-display-sidecar

  ocr-sidecar:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/ocr-sidecar/Dockerfile
    image: localhost/rebroid/ocr-sidecar:local
    container_name: rebroid-ocr-sidecar
    restart: unless-stopped
    expose:
      - "8100"
    networks:
      platform:
        aliases:
          - rebroid-ocr-sidecar

volumes:
  orchestrator-data:
  firewall-agent-run:
  orchestrator-uploads:
  shared-secrets:
  web-data:

networks:
  platform:
    name: rebroid-platform
