services:
  orchestrator:
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    image: rebroid/orchestrator:test
    container_name: rebroid-orchestrator-test
    user: '0:0'
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ORCHESTRATOR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET:-}
      ORCHESTRATOR_SHARED_SECRET_FILE: /app/secrets/orchestrator-secret
      CONTAINER_IMAGE: ${CONTAINER_IMAGE:-redroid/redroid:13.0.0-latest}
      REDROID_ADB_PORT: ${REDROID_ADB_PORT:-5555}
      REDROID_PRIVILEGED: ${REDROID_PRIVILEGED:-true}
      FIREWALL_AGENT_SOCKET: /run/rebroid-firewall/agent.sock
      DISPLAY_SIDECAR_IMAGE: rebroid/display-sidecar:test
      DISPLAY_SIDECAR_CONTAINER_NAME: rebroid-display-sidecar-test
      DISPLAY_SIDECAR_INTERNAL_BASE_URL: http://rebroid-display-sidecar-test:8000
      DISPLAY_SIDECAR_AUTO_START: 'false'
      MAX_APK_UPLOAD_SIZE_MB: ${MAX_APK_UPLOAD_SIZE_MB:-512}
    expose:
      - '4100'
    volumes:
      - ${CONTAINER_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - orchestrator-test-data:/app/data
      - orchestrator-test-uploads:/app/uploads
      - shared-test-secrets:/app/secrets
      - firewall-agent-test-run:/run/rebroid-firewall
    networks:
      - platform

  firewall-agent:
    build:
      context: ..
      dockerfile: apps/firewall-agent/Dockerfile
    image: rebroid/firewall-agent:test
    container_name: rebroid-firewall-agent-test
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      FIREWALL_AGENT_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET:-}
      FIREWALL_AGENT_SHARED_SECRET_FILE: /app/secrets/orchestrator-secret
    volumes:
      - shared-test-secrets:/app/secrets:ro
      - firewall-agent-test-run:/run/rebroid-firewall

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PROXY_CLIENT_MAX_BODY_SIZE: ${NEXT_PROXY_CLIENT_MAX_BODY_SIZE:-512mb}
        DISPLAY_SIDECAR_INTERNAL_BASE_URL: ${DISPLAY_SIDECAR_INTERNAL_BASE_URL:-http://rebroid-display-sidecar-test:8000}
    image: rebroid/web:test
    container_name: rebroid-web-test
    restart: unless-stopped
    depends_on:
      - orchestrator
      - display-sidecar
    environment:
      NODE_ENV: production
      ORCHESTRATOR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET:-}
      ORCHESTRATOR_SHARED_SECRET_FILE: /app/secrets/orchestrator-secret
      ORCHESTRATOR_API_URL: http://orchestrator:4100
      DISPLAY_SIDECAR_INTERNAL_BASE_URL: http://rebroid-display-sidecar-test:8000
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - '${REBROID_PORT:-3001}:3001'
    volumes:
      - web-test-data:/app/data
      - shared-test-secrets:/app/secrets
    networks:
      - platform

  display-sidecar:
    build:
      context: ..
      dockerfile: apps/display-sidecar/Dockerfile
    image: rebroid/display-sidecar:test
    container_name: rebroid-display-sidecar-test
    restart: unless-stopped
    environment:
      DISPLAY_SIDECAR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET:-}
      DISPLAY_SIDECAR_SHARED_SECRET_FILE: /app/secrets/orchestrator-secret
      ORCHESTRATOR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET:-}
      ORCHESTRATOR_SHARED_SECRET_FILE: /app/secrets/orchestrator-secret
    expose:
      - '8000'
    volumes:
      - shared-test-secrets:/app/secrets
    networks:
      platform:
        aliases:
          - rebroid-display-sidecar-test

volumes:
  orchestrator-test-data:
  orchestrator-test-uploads:
  shared-test-secrets:
  web-test-data:
  firewall-agent-test-run:

networks:
  platform:
    name: rebroid-test-platform
