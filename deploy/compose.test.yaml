# Usage: docker compose -f deploy/compose.yaml -f deploy/compose.test.yaml up -d --build
services:
  orchestrator:
    image: rebroid/orchestrator:test
    environment:
      DISPLAY_SIDECAR_CONTAINER_NAME: rebroid-display-sidecar-test
      MAX_APK_UPLOAD_SIZE_MB: ${MAX_APK_UPLOAD_SIZE_MB:-512}
    volumes:
      - orchestrator-test-data:/app/data
      - orchestrator-test-uploads:/app/uploads
      - shared-test-secrets:/app/secrets
      - firewall-agent-test-run:/run/rebroid-firewall

  firewall-agent:
    image: rebroid/firewall-agent:test
    volumes:
      - firewall-agent-test-run:/run/rebroid-firewall
      - shared-test-secrets:/app/secrets:ro

  web:
    image: rebroid/web:test
    environment:
      DISPLAY_SIDECAR_INTERNAL_BASE_URL: http://rebroid-display-sidecar-test:8000
    volumes:
      - web-test-data:/app/data
      - shared-test-secrets:/app/secrets:ro

  edge:
    image: rebroid/edge:test
    ports: !override
      - "${REBROID_PORT:-3001}:3443"
    volumes:
      - web-test-data:/app/data:ro

  display-sidecar:
    image: rebroid/display-sidecar:test
    container_name: rebroid-display-sidecar-test
    environment:
      DISPLAY_WEBRTC_UDP_PORT: ${TEST_DISPLAY_WEBRTC_UDP_PORT:-40101}
    ports: !override
      - "${TEST_DISPLAY_WEBRTC_UDP_PORT:-40101}:${TEST_DISPLAY_WEBRTC_UDP_PORT:-40101}/udp"
    volumes:
      - shared-test-secrets:/app/secrets:ro

  ocr-sidecar:
    image: rebroid/ocr-sidecar:test

  external-adb:
    image: rebroid/display-sidecar:test
    environment:
      DISPLAY_WEBRTC_UDP_PORT: ${TEST_EXTERNAL_DISPLAY_WEBRTC_UDP_PORT:-40102}
    ports: !override
      - "${TEST_EXTERNAL_DISPLAY_WEBRTC_UDP_PORT:-40102}:${TEST_EXTERNAL_DISPLAY_WEBRTC_UDP_PORT:-40102}/udp"
    volumes:
      - external-adb-test-keys:/app/adb-keys
      - type: volume
        source: shared-test-secrets
        target: /run/rebroid-external-adb
        read_only: true
        volume:
          subpath: external-adb
          nocopy: true

volumes:
  orchestrator-test-data:
  orchestrator-test-uploads:
  firewall-agent-test-run:
  shared-test-secrets:
  web-test-data:
  external-adb-test-keys:

networks:
  platform:
    name: rebroid-test-platform
