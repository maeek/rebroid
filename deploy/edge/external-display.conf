location ~ ^/external-display/(viewer/display(?:/assets/[A-Za-z0-9_.-]+)?|rebroid/display/(?:stream|control|public/sessions/[0-9a-f-]+/[-a-z/]+))$ {
  rewrite ^/external-display(/.*)$ $1 break;
  proxy_pass http://external-adb:8000;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Rebroid-Sidecar-Secret "";
  proxy_set_header X-Orchestrator-Secret "";
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Accept-Encoding "";
  proxy_cache off;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_socket_keepalive on;
  gzip off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}

location /external-display/ {
  return 404;
}
