services:
  orchestrator:
    build: .
    container_name: shop-me-alone-orchestrator
    ports:
      - "4100:4100"
    environment:
      PORT: 4100
      DATABASE_PATH: /app/data/orchestrator.sqlite
      UPLOADS_DIR: /app/uploads
      ORCHESTRATOR_SHARED_SECRET: change-me
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      ORCHESTRATOR_CONTAINER_ID: shop-me-alone-orchestrator
      CONTAINER_IMAGE: redroid/redroid:13.0.0-latest
      REDROID_PRIVILEGED: "true"
    volumes:
      # On macOS, Podman Desktop / podman-mac-helper can expose this Docker-compatible
      # socket path. The orchestrator uses dockerode, so it only needs Docker API
      # compatibility, not the Docker engine specifically.
      - /var/run/docker.sock:/var/run/docker.sock
      - orchestrator-data:/app/data
      - orchestrator-uploads:/app/uploads

volumes:
  orchestrator-data:
  orchestrator-uploads:
