services:
  orchestrator:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    container_name: rebroid-orchestrator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ORCHESTRATOR_SHARED_SECRET_FILE: /app/secrets/orchestrator-secret
    ports:
      - '4100:4100'
    cap_add:
      - NET_ADMIN
    volumes:
      - ${CONTAINER_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - orchestrator-data:/app/data
      - orchestrator-uploads:/app/uploads
      - orchestrator-secrets:/app/secrets

volumes:
  orchestrator-data:
  orchestrator-uploads:
  orchestrator-secrets:
