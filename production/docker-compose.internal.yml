services:
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    image: rebroid/orchestrator:local
    container_name: rebroid-orchestrator
    privileged: true
    user: "0:0"
    restart: unless-stopped
    environment:
      DISPLAY_SIDECAR_IMAGE: rebroid/display-sidecar:local
      DISPLAY_SIDECAR_PUBLISHED_HOST_PORT: 8000
      DISPLAY_WEBRTC_UDP_PORT_RANGE: ${DISPLAY_WEBRTC_UDP_PORT_RANGE:-40000-40100}
      DISPLAY_WEBRTC_ICE_HOST: ${DISPLAY_WEBRTC_ICE_HOST:-}
      DISPLAY_SIDECAR_BUILD_CONTEXT: /app/display-sidecar
    cap_add:
      - NET_ADMIN
    expose:
      - "4100"
      - "8000"
    ports:
      - "${DISPLAY_WEBRTC_UDP_PORT_RANGE:-40000-40100}:${DISPLAY_WEBRTC_UDP_PORT_RANGE:-40000-40100}/udp"
    volumes:
      - orchestrator-data:/app/data
      - orchestrator-uploads:/app/uploads
      - shared-secrets:/app/secrets
      - orchestrator-docker-data:/var/lib/docker
      - ./display-sidecar:/app/display-sidecar:ro
    networks:
      - platform

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        DISPLAY_SIDECAR_INTERNAL_BASE_URL: http://orchestrator:8000
    image: rebroid/web:local
    container_name: rebroid-web
    restart: unless-stopped
    depends_on:
      - orchestrator
    environment:
      REBROID_TLS_HOSTS: ${REBROID_TLS_HOSTS:-localhost,127.0.0.1}
      DISPLAY_SIDECAR_INTERNAL_BASE_URL: http://orchestrator:8000
    ports:
      - "${REBROID_HTTPS_PORT:-3443}:3443"
    volumes:
      - web-data:/app/data
      - shared-secrets:/app/secrets
    networks:
      - platform

volumes:
  orchestrator-data:
  orchestrator-docker-data:
  orchestrator-uploads:
  shared-secrets:
  web-data:

networks:
  platform:
    name: rebroid-platform
