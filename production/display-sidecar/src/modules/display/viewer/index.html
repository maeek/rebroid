<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rebroid Display</title>
  <link rel="stylesheet" href="/viewer/display/assets/styles.css" />
</head>
<body>
  <main>
    <canvas id="screen" class="hidden"></canvas>
    <section id="message">
      <div class="device" aria-hidden="true">
        <div class="screen-art">
          <svg class="cast-mark" viewBox="0 0 64 64" focusable="false" aria-hidden="true">
            <rect x="10" y="12" width="44" height="32" rx="5" />
            <path d="M12 48a4 4 0 0 1 4 4" />
            <path d="M12 38a14 14 0 0 1 14 14" />
            <path d="M12 28a24 24 0 0 1 24 24" />
          </svg>
        </div>
      </div>
      <h1 id="message-title">Starting live display</h1>
      <p id="message-copy">Rebroid is opening the app screen.</p>
      <p id="status">Connecting...</p>
    </section>
  </main>
  <script type="module" src="/viewer/display/assets/app.js"></script>
</body>
</html>
