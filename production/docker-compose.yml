services:
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    image: rebroid/orchestrator:local
    container_name: rebroid-orchestrator
    user: '0:0'
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_PATH: /data/config/orchestrator.sqlite
      SETTINGS_PATH: /data/config/orchestrator-settings.json
      UPLOADS_DIR: /data/uploads
      ORCHESTRATOR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET:-}
      ORCHESTRATOR_SHARED_SECRET_FILE: /data/secrets/orchestrator-secret
      CONTAINER_IMAGE: ${CONTAINER_IMAGE:-redroid/redroid:13.0.0-latest}
      REDROID_PRIVILEGED: ${REDROID_PRIVILEGED:-true}
      MAX_APK_UPLOAD_SIZE_MB: ${MAX_APK_UPLOAD_SIZE_MB:-4096}
      IPTABLES_POLICY_ENABLED: ${IPTABLES_POLICY_ENABLED:-false}
      WS_SCRCPY_IMAGE: rebroid/ws-scrcpy-sidecar:local
      WS_SCRCPY_AUTO_START: 'false'
    cap_add:
      - NET_ADMIN
    expose:
      - '4100'
    volumes:
      - ${CONTAINER_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - orchestrator-data:/data/config
      - orchestrator-uploads:/data/uploads
      - shared-secrets:/data/secrets
    networks:
      - platform

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PROXY_CLIENT_MAX_BODY_SIZE: ${NEXT_PROXY_CLIENT_MAX_BODY_SIZE:-4096mb}
        WS_SCRCPY_INTERNAL_BASE_URL: ${WS_SCRCPY_INTERNAL_BASE_URL:-http://sma-ws-scrcpy:8000}
    image: rebroid/web:local
    container_name: rebroid-web
    restart: unless-stopped
    depends_on:
      - orchestrator
      - ws-scrcpy
    environment:
      NODE_ENV: production
      ORCHESTRATOR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET:-}
      ORCHESTRATOR_SHARED_SECRET_FILE: /data/secrets/orchestrator-secret
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - '${REBROID_PORT:-3001}:3001'
    volumes:
      - web-data:/data
      - shared-secrets:/data/secrets
    networks:
      - platform

  ws-scrcpy:
    build:
      context: ./ws-scrcpy-sidecar
      dockerfile: Dockerfile
    image: rebroid/ws-scrcpy-sidecar:local
    container_name: sma-ws-scrcpy
    restart: unless-stopped
    expose:
      - '8000'
    networks:
      platform:
        aliases:
          - sma-ws-scrcpy

volumes:
  orchestrator-data:
  orchestrator-uploads:
  shared-secrets:
  web-data:

networks:
  platform:
    name: rebroid-platform
